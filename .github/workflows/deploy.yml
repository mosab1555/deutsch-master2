name: Deploy client to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Version static assets (cache busting)
        run: node tools/inject-version.js "${{ github.sha }}"

      - name: Build learner-only Pages artifact (excludes Academy portal)
        run: node tools/build-pages-artifact.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload learner-only artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist/pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
